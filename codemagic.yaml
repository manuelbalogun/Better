workflows:
  better-android-debug:
    name: Better Android (debug APK)
    # The free plan only grants macOS M2 minutes, so this stays mac_mini_m2 even
    # though an Android build needs no macOS. linux_x2 is a paid instance type.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install web dependencies
        script: npm ci
      - name: Sync web app into Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

workflows:
  better-android-debug:
    name: Better Android (debug APK)
    # Android needs no macOS. Linux machines are a much bigger pool, so builds
    # start sooner. Swap back to mac_mini_m2 only if you ever add an iOS build.
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install web dependencies
        script: npm ci
      - name: Sync web app into Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
